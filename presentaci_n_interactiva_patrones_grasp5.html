<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patrones GRASP — Sistema de Reservas de Hotel Multi-sede</title>
    <style>
        :root {
            --bg-dark: #060b16;
            --bg-panel: #0f172a;
            --bg-card: #1e293b;
            --bg-code: #090d16;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-indigo: #6366f1;
            --accent-green: #10b981;
            --accent-red: #f43f5e;
            --accent-amber: #f59e0b;
            --accent-purple: #a855f7;
            --font-sans: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'Consolas', 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(56, 189, 248, 0.08) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Barra de progreso superior */
        .progress-track {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: #0f172a;
            z-index: 100;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-indigo), var(--accent-blue), var(--accent-green));
            width: 9.09%;
            transition: width 0.25s ease;
        }

        /* Header superior */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            padding: 10px 20px;
            background: rgba(15, 23, 42, 0.92);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            z-index: 50;
        }

        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .brand-title {
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--text-main);
            padding-left: 6px;
            border-left: 2px solid var(--border-color);
        }

        .btn {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.18s ease;
            user-select: none;
        }
        .btn:hover:not(:disabled) {
            border-color: var(--accent-blue);
            background: #26354d;
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--accent-indigo);
            border-color: #818cf8;
            color: #fff;
        }
        .btn-primary:hover:not(:disabled) {
            background: #4f46e5;
            border-color: #a5b4fc;
        }

        .btn-sky {
            background: rgba(56, 189, 248, 0.12);
            border-color: rgba(56, 189, 248, 0.4);
            color: #7dd3fc;
        }
        .btn-sky.active-toggle {
            background: rgba(56, 189, 248, 0.28);
            border-color: var(--accent-blue);
            color: #fff;
        }

        .btn-amber {
            background: rgba(245, 158, 11, 0.12);
            border-color: rgba(245, 158, 11, 0.4);
            color: #fcd34d;
        }
        .btn-amber.active-toggle {
            background: rgba(245, 158, 11, 0.28);
            border-color: var(--accent-amber);
            color: #fff;
        }

        /* Selector global SIN vs CON en el header */
        .version-pill-group {
            display: inline-flex;
            background: #060b16;
            padding: 3px;
            border-radius: 9px;
            border: 1px solid var(--border-color);
            gap: 4px;
        }
        .version-pill {
            padding: 5px 11px;
            border-radius: 6px;
            font-size: 0.76rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            background: transparent;
            color: var(--text-muted);
            transition: all 0.18s ease;
        }
        .version-pill.active-without {
            background: var(--accent-red);
            color: #fff;
            box-shadow: 0 2px 10px rgba(244, 63, 94, 0.35);
        }
        .version-pill.active-with {
            background: var(--accent-green);
            color: #fff;
            box-shadow: 0 2px 10px rgba(16, 185, 129, 0.35);
        }

        /* Contenedor principal de diapositiva */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 1460px;
            width: 100%;
            margin: 0 auto;
            padding: 14px 20px;
        }

        .slide-card {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 16px;
            padding: 20px 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
            animation: fadeIn 0.22s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Encabezado de cada patrón */
        .pattern-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding-bottom: 14px;
            margin-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .pattern-title-wrap {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-width: 820px;
        }

        .badges-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 0.74rem;
            font-weight: 700;
            letter-spacing: 0.03em;
        }
        .badge-indigo {
            background: rgba(99, 102, 241, 0.18);
            border: 1px solid rgba(99, 102, 241, 0.45);
            color: #a5b4fc;
        }
        .badge-green {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #6ee7b7;
        }

        .pattern-h2 {
            font-size: 1.55rem;
            font-weight: 800;
            color: #fff;
        }
        .pattern-h2 span {
            color: var(--accent-blue);
            font-weight: 600;
            font-size: 1.15rem;
        }

        .concept-text {
            font-size: 0.9rem;
            color: #cbd5e1;
            line-height: 1.45;
            background: rgba(30, 41, 59, 0.55);
            padding: 8px 12px;
            border-radius: 8px;
            border-left: 3px solid var(--accent-blue);
        }

        /* Grid de 2 columnas: Izquierda Código + Impacto | Derecha Diagrama UML */
        .pattern-grid {
            display: grid;
            grid-template-columns: 1fr 1.08fr;
            gap: 18px;
            align-items: stretch;
        }

        @media (max-width: 1080px) {
            .pattern-grid {
                grid-template-columns: 1fr;
            }
        }

        .col-left, .col-right {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Ventana de código Java */
        .code-window {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-code);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }
        .code-window.border-with {
            border-color: rgba(16, 185, 129, 0.5);
        }
        .code-window.border-without {
            border-color: rgba(244, 63, 94, 0.5);
        }

        .code-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            background: #111827;
            border-bottom: 1px solid #1f2937;
        }
        .window-dots {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .dot-red { background: #ef4444; }
        .dot-amber { background: #f59e0b; }
        .dot-green { background: #10b981; }

        .filename-label {
            font-family: var(--font-mono);
            font-size: 0.78rem;
            color: #e2e8f0;
            margin-left: 8px;
            font-weight: 600;
        }

        pre.java-pre {
            padding: 16px;
            overflow-x: auto;
            font-family: var(--font-mono);
            font-size: 0.83rem;
            line-height: 1.55;
            color: #e2e8f0;
            flex: 1;
        }

        /* Colores de sintaxis Java integrados */
        .tok-kw { color: #f472b6; font-weight: 600; }
        .tok-type { color: #38bdf8; font-weight: 600; }
        .tok-str { color: #34d399; }
        .tok-cm { color: #64748b; font-style: italic; }
        .tok-num { color: #fbbf24; }
        .tok-fn { color: #c084fc; }

        /* Caja de explicación de impacto SIN vs CON */
        .impact-box {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.86rem;
            line-height: 1.5;
        }
        .impact-with {
            background: rgba(6, 78, 59, 0.35);
            border: 1px solid rgba(16, 185, 129, 0.45);
            color: #d1fae5;
        }
        .impact-without {
            background: rgba(136, 19, 55, 0.35);
            border: 1px solid rgba(244, 63, 94, 0.45);
            color: #ffe4e6;
        }
        .impact-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 6px;
            font-weight: 700;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        /* Panel derecho: Diagrama de Clases UML */
        .uml-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0b1120;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            justify-content: space-between;
        }
        .uml-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #1e293b;
            font-size: 0.82rem;
            font-weight: 700;
            color: #e2e8f0;
        }
        .uml-stage {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            min-height: 310px;
        }
        .uml-svg {
            width: 100%;
            height: auto;
            max-height: 370px;
            font-family: var(--font-mono);
        }
        .uml-legend {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            padding-top: 10px;
            border-top: 1px solid #1e293b;
            font-family: var(--font-mono);
            font-size: 0.74rem;
            color: var(--text-muted);
        }

        /* Portada e Índice */
        .cover-hero {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.95));
            border: 1px solid rgba(99, 102, 241, 0.35);
            border-radius: 14px;
            padding: 22px 26px;
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 18px;
        }
        .cover-title {
            font-size: 1.9rem;
            font-weight: 800;
            color: #fff;
            margin: 6px 0 8px;
        }
        .cover-sub {
            color: #cbd5e1;
            font-size: 0.95rem;
            max-width: 780px;
            line-height: 1.5;
        }
        .index-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 10px;
        }
        .index-card {
            background: #131c31;
            border: 1px solid #263554;
            border-radius: 10px;
            padding: 12px 14px;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            transition: all 0.18s ease;
            color: var(--text-main);
        }
        .index-card:hover {
            border-color: var(--accent-blue);
            background: #192540;
            transform: translateY(-2px);
        }
        .index-num {
            background: rgba(56, 189, 248, 0.14);
            color: var(--accent-blue);
            border: 1px solid rgba(56, 189, 248, 0.35);
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 0.82rem;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* Notas de orador */
        .notes-panel {
            margin-top: 12px;
            background: rgba(120, 53, 15, 0.28);
            border: 1px solid rgba(245, 158, 11, 0.45);
            border-radius: 12px;
            padding: 12px 16px;
            color: #fef3c7;
            font-size: 0.86rem;
            line-height: 1.5;
        }

        /* Footer */
        footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            padding: 10px 24px;
            background: rgba(15, 23, 42, 0.92);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .nav-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .slide-counter {
            font-family: var(--font-mono);
            background: #060b16;
            padding: 5px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            color: #fff;
            font-weight: 700;
        }
        .kbd-tag {
            font-family: var(--font-mono);
            background: #1e293b;
            border: 1px solid #475569;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.72rem;
            color: #e2e8f0;
        }

        .hidden {
            display: none !important;
        }

        /* Tabla comparativa final */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-top: 16px;
        }
        @media (max-width: 900px) {
            .summary-grid { grid-template-columns: 1fr; }
        }
        .summary-card {
            background: #0b1324;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px;
        }
    </style>
</head>
<body>

    <div class="progress-track">
        <div id="progressBar" class="progress-bar"></div>
    </div>

    <header>
        <div class="header-left">
            <button class="btn" onclick="goToSlide(0)" title="Volver al Índice (Inicio)">
                🏠 Índice GRASP
            </button>
            <span id="headerSlideTitle" class="brand-title">Inicio — Portada e Índice</span>
        </div>

        <div class="header-right">
            <!-- Selector global SIN vs CON patrón -->
            <div id="headerVersionControls" class="version-pill-group hidden">
                <button id="topBtnWithout" class="version-pill" onclick="setPatternVersion('without')">
                    ❌ SIN Patrón
                </button>
                <button id="topBtnWith" class="version-pill" onclick="setPatternVersion('with')">
                    ✅ CON Patrón GRASP
                </button>
            </div>

            <!-- Botón para ocultar/mostrar explicación del patrón -->
            <button id="explanationToggleBtn" class="btn btn-sky" onclick="toggleExplanation()" title="Atajo: Tecla E">
                👁️ <span id="explanationToggleText">Ocultar Explicación (E)</span>
            </button>

            <!-- Botón de notas del orador -->
            <button id="notesToggleBtn" class="btn btn-amber" onclick="toggleNotes()" title="Atajo: Tecla N">
                🎙️ Guion Orador (N)
            </button>

            <button class="btn" onclick="toggleFullScreen()" title="Pantalla Completa (F)">
                ⛶
            </button>
        </div>
    </header>

    <main>
        <div id="slideContainer"></div>

        <div id="speakerNotesPanel" class="notes-panel hidden">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; font-weight:700; color:#fbbf24;">
                <span>🗣️ Guion de Exposición Sugerido (30 segundos)</span>
                <span style="cursor:pointer; font-size:0.76rem;" onclick="toggleNotes()">Cerrar [N]</span>
            </div>
            <p id="speakerNotesText"></p>
        </div>
    </main>

    <footer>
        <div>
            <strong>Sistema Web de Reservas para Hoteles (Multi-sede)</strong> · Ingeniería de Software
        </div>

        <div class="nav-controls">
            <button id="prevBtn" class="btn" onclick="prevSlide()">◀ Anterior</button>
            <span class="slide-counter">
                <span id="currentSlideNum">1</span> / <span id="totalSlidesNum">11</span>
            </span>
            <button id="nextBtn" class="btn btn-primary" onclick="nextSlide()">Siguiente ▶</button>
        </div>

        <div>
            Atajos: <span class="kbd-tag">← →</span> Diapositiva
            <span class="kbd-tag">V</span> Alternar SIN/CON
            <span class="kbd-tag">E</span> Ocultar Explicación
            <span class="kbd-tag">N</span> Guion
        </div>
    </footer>

    <script>
        let currentSlideIndex = 0;
        let currentVersion = 'with'; // 'without' | 'with'
        let explanationVisible = true;
        let notesVisible = false;

        // Definiciones de flechas UML en SVG
        const umlSvgDefs = `
            <defs>
                <marker id="arrow-open" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                    <path d="M 1 2 L 10 6 L 1 10" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
                </marker>
                <marker id="arrow-open-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                    <path d="M 1 2 L 10 6 L 1 10" fill="none" stroke="#f43f5e" stroke-width="1.8" stroke-linecap="round"/>
                </marker>
                <marker id="arrow-triangle" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
                    <polygon points="1,2 12,7 1,12" fill="#0b1120" stroke="#10b981" stroke-width="1.8"/>
                </marker>
                <marker id="diamond-filled" viewBox="0 0 16 12" refX="2" refY="6" markerWidth="11" markerHeight="9" orient="auto">
                    <polygon points="1,6 8,1 15,6 8,11" fill="#38bdf8" stroke="#38bdf8" stroke-width="1.2"/>
                </marker>
            </defs>
        `;

        function escapeSvgText(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/<<\s*/g, '«')
                .replace(/\s*>>/g, '»')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        // Dibuja una caja de clase UML garantizando que el texto NUNCA se salga del cuadro
        function drawUmlBox({ x, y, w = 340, title, stereotype = '', attrs = [], methods = [], variant = 'normal' }) {
            const palettes = {
                normal:      { border: '#38bdf8', headerBg: '#0f2942', bg: '#0f172a', titleColor: '#ffffff', stereoColor: '#7dd3fc' },
                interface:   { border: '#10b981', headerBg: '#063229', bg: '#0f172a', titleColor: '#ecfdf5', stereoColor: '#6ee7b7' },
                bad:         { border: '#f43f5e', headerBg: '#3b0d1c', bg: '#0f172a', titleColor: '#ffe4e6', stereoColor: '#fda4af' },
                muted:       { border: '#64748b', headerBg: '#1e293b', bg: '#0f172a', titleColor: '#e2e8f0', stereoColor: '#94a3b8' },
                fabrication: { border: '#a855f7', headerBg: '#2e1049', bg: '#0f172a', titleColor: '#f3e8ff', stereoColor: '#d8b4fe' }
            };
            const pal = palettes[variant] || palettes.normal;

            const cleanStereo = stereotype ? escapeSvgText(stereotype) : '';
            const cleanTitle = escapeSvgText(title);

            const headerHeight = cleanStereo ? 46 : 32;
            const attrHeight = Math.max(26, attrs.length * 21 + 12);
            const methodHeight = Math.max(28, methods.length * 21 + 12);
            const totalHeight = headerHeight + attrHeight + methodHeight;

            const maxInnerWidth = w - 24;

            const renderLine = (text, posY, color) => {
                const rawStr = String(text || '');
                const estimatedPx = rawStr.length * 7.2;
                const fitAttr = estimatedPx > maxInnerWidth
                    ? ` textLength="${maxInnerWidth}" lengthAdjust="spacingAndGlyphs"`
                    : '';
                return `<text x="${x + 12}" y="${posY}" fill="${color}" font-size="12"${fitAttr}>${escapeSvgText(rawStr)}</text>`;
            };

            const attrText = attrs.map((a, i) => renderLine(a, y + headerHeight + 19 + i * 21, '#cbd5e1')).join('');
            const methodText = methods.map((m, i) => renderLine(m, y + headerHeight + attrHeight + 19 + i * 21, '#93c5fd')).join('');

            return `
                <g>
                    <rect x="${x}" y="${y}" width="${w}" height="${totalHeight}" rx="8" fill="${pal.bg}" stroke="${pal.border}" stroke-width="2"/>
                    <path d="M ${x} ${y+8} Q ${x} ${y} ${x+8} ${y} L ${x+w-8} ${y} Q ${x+w} ${y} ${x+w} ${y+8} L ${x+w} ${y+headerHeight} L ${x} ${y+headerHeight} Z" fill="${pal.headerBg}"/>
                    ${cleanStereo ? `<text x="${x + w/2}" y="${y + 17}" text-anchor="middle" fill="${pal.stereoColor}" font-size="11" font-style="italic">${cleanStereo}</text>` : ''}
                    <text x="${x + w/2}" y="${y + (cleanStereo ? 36 : 22)}" text-anchor="middle" fill="${pal.titleColor}" font-size="13.5" font-weight="bold">${cleanTitle}</text>
                    <line x1="${x}" y1="${y + headerHeight}" x2="${x + w}" y2="${y + headerHeight}" stroke="${pal.border}" stroke-width="1.4"/>
                    <line x1="${x}" y1="${y + headerHeight + attrHeight}" x2="${x + w}" y2="${y + headerHeight + attrHeight}" stroke="${pal.border}" stroke-width="1" stroke-opacity="0.6"/>
                    ${attrText}
                    ${methodText}
                </g>
            `;
        }

        // Resaltador ligero de sintaxis Java sin librerías externas
        function highlightJava(code) {
            let escaped = code
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

            const tokens = [];
            const saveToken = (html) => {
                const id = `@@TOK_${tokens.length}@@`;
                tokens.push(html);
                return id;
            };

            // 1. Comentarios y Strings primero para no tocar su interior
            escaped = escaped.replace(/(\/\/[^\n]*)/g, (m) => saveToken(`<span class="tok-cm">${m}</span>`));
            escaped = escaped.replace(/("[^"]*")/g, (m) => saveToken(`<span class="tok-str">${m}</span>`));

            // 2. Palabras clave de Java
            escaped = escaped.replace(/\b(public|private|protected|class|interface|implements|extends|return|new|if|else|for|boolean|double|int|void|byte|this|static|true|false|null)\b/g,
                '<span class="tok-kw">$1</span>');

            // 3. Clases del dominio hotelero
            escaped = escaped.replace(/\b(String|List|ArrayList|Reserva|Consumo|CuentaHabitacion|CheckOutService|RecepcionistaUI|CheckInController|ReservaService|CanalNotificacion|NotificadorEmail|ServidorCorreoGmail|Habitacion|HabitacionTodoterreno|PoliticaReembolso|ReembolsoTotal|ReembolsoConPenalidad|CalculadoraReembolso|GeneradorPdfQR|AdaptadorPasarelaPSE|ApiExternaBancoPSE|CalculadoraImpuestoLocal|ImpuestoSedeNacional|ImpuestoZonaTuristica|Factura|BaseDatosHotel|BotonCheckInUI)\b/g,
                '<span class="tok-type">$1</span>');

            // 4. Restaurar comentarios y strings
            escaped = escaped.replace(/@@TOK_(\d+)@@/g, (_, idx) => tokens[Number(idx)]);
            return escaped;
        }

public class Consumo {
    private int cantidad;
    private double valorUnitario;

    public double getSubtotal() { return cantidad * valorUnitario; }

    private int noches;
    private double precioPorNoche;
    private List<Consumo> consumos;

    // Reserva es la experta: posee noches, tarifa y lista de consumos
    public double calcularTotalCuenta() {
        double totalEstadia = noches * precioPorNoche;
        double totalConsumos = 0;

}`,

                                <div class="uml-topbar">
                                    <span>📐 Diagrama de Clases UML (${isWith ? 'CON Patrón GRASP' : 'SIN Patrón'})</span>
                                    <span class="badge ${isWith ? 'badge-green' : 'badge-indigo'}">
                                        ${isWith ? 'Arquitectura Limpia' : 'Acoplado / Anti-patrón'}
                                    </span>
                                </div>
                                <div class="uml-stage">
                                    ${slide.umlGenerator(currentVersion)}
                                </div>
                                <div class="uml-legend">
                                    <span><strong style="color:#38bdf8;">◆──▶</strong> Composición</span>
                                    <span><strong style="color:#10b981;">- - ▷</strong> Realización de Interfaz</span>
                                    <span><strong style="color:#38bdf8;">───▶</strong> Asociación / Dependencia</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderSummarySlide(slide) {
            return `
                <div class="slide-card">
                    <span class="badge badge-indigo">${slide.badge}</span>
                    <h2 class="pattern-h2" style="margin-top:8px;">${slide.title}</h2>
                    <p style="color:#cbd5e1; margin-top:6px;">${slide.subtitle}</p>

                    <div class="summary-grid">
                        <div class="summary-card">
                            <span class="badge badge-indigo">1. El Principio Evaluativo</span>
                            <h3 style="margin:10px 0 8px; color:#38bdf8;">Low Coupling (Bajo Acoplamiento)</h3>
                            <p style="font-size:0.9rem; color:#cbd5e1; line-height:1.5;">
                                Es una <strong>métrica general de salud</strong> en todo el software: medir qué tan conectada está una clase a otras clases concretas.
                            </p>
                            <div style="margin-top:12px; font-family:var(--font-mono); font-size:0.78rem; color:#6ee7b7;">
                                Ejemplo Hotel: ReservaService usa CanalNotificacion (HU-05).
                            </div>
                        </div>

                        <div class="summary-card">
                            <span class="badge badge-green">2. El Mecanismo Estructural</span>
                            <h3 style="margin:10px 0 8px; color:#10b981;">Indirection (Indirección)</h3>
                            <p style="font-size:0.9rem; color:#cbd5e1; line-height:1.5;">
                                Es la <strong>acción concreta de interponer un objeto intermediario</strong> (como un Adaptador) para que dos sistemas no hablen directamente.
                            </p>
                            <div style="margin-top:12px; font-family:var(--font-mono); font-size:0.78rem; color:#6ee7b7;">
                                Ejemplo Hotel: AdaptadorPasarelaPSE entre el hotel y el banco (HU-03).
                            </div>
                        </div>

                        <div class="summary-card">
                            <span class="badge badge-indigo">3. El Propósito Estratégico</span>
                            <h3 style="margin:10px 0 8px; color:#c084fc;">Protected Variations (Variaciones Protegidas)</h3>
                            <p style="font-size:0.9rem; color:#cbd5e1; line-height:1.5;">
                                Es <strong>blindar deliberadamente un punto inestable</strong> (leyes, impuestos locales por sede) encapsulándolo tras una interfaz estable.
                            </p>
                            <div style="margin-top:12px; font-family:var(--font-mono); font-size:0.78rem; color:#6ee7b7;">
                                Ejemplo Hotel: CalculadoraImpuestoLocal en Factura (HU-12).
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderSlide(index) {
            const slide = slides[index];
            const container = document.getElementById('slideContainer');
            const headerVersionControls = document.getElementById('headerVersionControls');

            document.getElementById('currentSlideNum').textContent = index + 1;
            document.getElementById('totalSlidesNum').textContent = slides.length;
            document.getElementById('headerSlideTitle').textContent = slide.type === 'cover'
                ? 'Inicio — Portada e Índice'
                : slide.type === 'summary'
                    ? '11. Síntesis Comparativa Final'
                    : `${slide.number}. ${slide.name} (${slide.spanishName})`;

            document.getElementById('progressBar').style.width = `${((index + 1) / slides.length) * 100}%`;
            document.getElementById('prevBtn').disabled = index === 0;
            document.getElementById('nextBtn').disabled = index === slides.length - 1;
            document.getElementById('speakerNotesText').textContent = slide.notes;

            if (slide.type === 'pattern') {
                headerVersionControls.classList.remove('hidden');
                updateTopVersionButtons();
                container.innerHTML = renderPatternSlide(slide);
            } else {
                headerVersionControls.classList.add('hidden');
                container.innerHTML = slide.type === 'cover' ? renderCoverSlide(slide) : renderSummarySlide(slide);
            }
        }

        function updateTopVersionButtons() {
            const btnWithout = document.getElementById('topBtnWithout');
            const btnWith = document.getElementById('topBtnWith');
            btnWithout.className = 'version-pill ' + (currentVersion === 'without' ? 'active-without' : '');
            btnWith.className = 'version-pill ' + (currentVersion === 'with' ? 'active-with' : '');
        }

        function setPatternVersion(ver) {
            currentVersion = ver;
            renderSlide(currentSlideIndex);
        }

        function togglePatternVersion() {
            setPatternVersion(currentVersion === 'with' ? 'without' : 'with');
        }

        function toggleExplanation() {
            explanationVisible = !explanationVisible;
            const textEl = document.getElementById('explanationToggleText');
            const btnEl = document.getElementById('explanationToggleBtn');
            textEl.textContent = explanationVisible ? 'Ocultar Explicación (E)' : 'Mostrar Explicación (E)';
            btnEl.classList.toggle('active-toggle', !explanationVisible);
            renderSlide(currentSlideIndex);
        }

        function toggleNotes() {
            notesVisible = !notesVisible;
            document.getElementById('speakerNotesPanel').classList.toggle('hidden', !notesVisible);
            document.getElementById('notesToggleBtn').classList.toggle('active-toggle', notesVisible);
        }

        function nextSlide() {
            if (currentSlideIndex < slides.length - 1) {
                currentSlideIndex++;
                renderSlide(currentSlideIndex);
            }
        }

        function prevSlide() {
            if (currentSlideIndex > 0) {
                currentSlideIndex--;
                renderSlide(currentSlideIndex);
            }
        }

        function goToSlide(idx) {
            currentSlideIndex = idx;
            renderSlide(currentSlideIndex);
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                nextSlide();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevSlide();
            } else if (e.key.toLowerCase() === 'v') {
                togglePatternVersion();
            } else if (e.key.toLowerCase() === 'e') {
                toggleExplanation();
            } else if (e.key.toLowerCase() === 'n') {
                toggleNotes();
            } else if (e.key.toLowerCase() === 'f') {
                toggleFullScreen();
            }
        });

        // Inicialización inmediata sin esperar librerías externas
        renderSlide(0);
    </script>
</body>
</html>
